[platformio]
default_envs = esp8266mod

[env:esp32c3]
platform = espressif32@8.0.0
board = airm2m_core_esp32c3
framework = arduino
lib_deps = 256dpi/MQTT@2.5.3
monitor_speed = 115200
upload_speed = 115200
board_build.partitions = min_spiffs.csv
extra_scripts = pre:scripts/embed_web.py
    pre:scripts/w4home_foundation.py
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -Wall -Wextra
    -DARDUINO_USB_MODE=1


; For the LuatOS board variant whose USB port directly connects to GPIO18/19.
[env:esp32c3-usb]
extends = env:esp32c3
build_flags = ${env:esp32c3.build_flags} -DARDUINO_USB_CDC_ON_BOOT=1

; Print the underlying ESP-IDF I2C error hidden by Wire's generic error 4.
[env:esp32c3-sensor-debug]
extends = env:esp32c3
build_unflags = ${env:esp32c3.build_unflags} -DCORE_DEBUG_LEVEL=0
build_flags = ${env:esp32c3.build_flags} -DCORE_DEBUG_LEVEL=1

; Build-only smoke check; these fixture values are not a real account.
[env:esp32c3-mqtt-check]
extends = env:esp32c3
build_flags = ${env:esp32c3.build_flags}
    -DCLOCK_MQTT_CLIENT_ID=\"build-only-fixture\"
    -DCLOCK_MQTT_TOPIC=\"build-only-topic\"

; ESP-12E / ESP-12F modules with 4 MB flash (including NodeMCU).
[env:esp8266mod]
platform = espressif8266@4.2.1
board = esp12e
framework = arduino
board_build.f_cpu = 160000000L
board_build.filesystem = littlefs
lib_deps = 256dpi/MQTT@2.5.3
monitor_speed = 115200
upload_speed = 115200
extra_scripts = pre:scripts/embed_web.py
build_src_filter = +<*> -<w4home_client.cpp>
build_flags = -Wall -Wextra -DCJSON_NESTING_LIMIT=12

; Optional native compiler for Apple Silicon without Rosetta.
[env:esp8266mod-macos-arm64]
extends = env:esp8266mod
platform_packages =
    toolchain-xtensa @ https://github.com/esphome-libs/xtensa-lx106-elf-toolchain/releases/download/10.3.0-esphome.3/toolchain-xtensa-lx106-elf-10.3.0-esphome.3-darwin_arm64.tar.gz
