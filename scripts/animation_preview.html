<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VFD 动画工作台</title><style>
:root{--surface:#101715;--panel:#18231f;--text:#e6eee7;--muted:#a1b5a7;--green:#9af5c0;--border:#34473d;--space:24px;--display:"Georgia","Songti SC",serif;--mono:"Courier New",monospace;--body:"Helvetica Neue","PingFang SC",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--surface);color:var(--text);font:14px/1.7 var(--body)}main{max-width:1000px;margin:auto;padding:48px 24px}.eyebrow{font:11px var(--mono);letter-spacing:2px;color:var(--green)}h1{font:clamp(28px,5vw,44px)/1.4 var(--display);font-weight:400;margin:20px 0}p{color:var(--muted)}.controls{display:flex;gap:16px;flex-wrap:wrap;margin:36px 0 24px}label{display:grid;gap:8px;font-size:12px;color:var(--muted)}select,button{font:14px var(--body);padding:10px 16px;background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:2px}button{cursor:pointer;align-self:end;min-width:80px}button:hover{color:var(--green)}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--green);outline-offset:4px}.screen{border:1px solid var(--border);border-top:3px solid var(--green);background:#08100c;padding:clamp(12px,3vw,32px);box-shadow:inset 0 0 56px #0008}.row{display:grid;grid-template-columns:repeat(20,minmax(0,1fr));gap:clamp(1px,.5vw,6px);margin:12px 0}.cell{font:clamp(12px,3vw,30px)/1.5 var(--mono);height:1.5em;text-align:center;color:var(--green);text-shadow:0 0 10px #9af5c060;border-bottom:1px solid #9af5c018;white-space:pre}.off .cell{color:transparent;text-shadow:none}.meta{display:flex;justify-content:space-between;gap:16px;font:11px/1.7 var(--mono);letter-spacing:1px;color:var(--muted);margin:20px 0}input[type=range]{width:100%;accent-color:var(--green)}.note{border-top:1px solid var(--border);margin-top:36px;padding-top:24px;font-size:12px}code{color:var(--green)}@media(max-width:500px){main{padding-top:28px}.controls{gap:12px}.meta{font-size:10px;letter-spacing:0}}
</style></head><body><main><div class="eyebrow">VFD / ANIMATION WORKBENCH</div><h1>让每一次变化，都恰到好处。</h1><p>由固件同一套动画引擎生成的离线预览。切换场景、调整动效等级，或拖动时间轴检查中间帧。</p><div class="controls"><label>场景<select id="scene"></select></label><label>动效等级<select id="mode"><option>关闭</option><option>轻量</option><option selected>标准</option></select></label><button id="play" type="button">暂停</button><button id="replay" type="button">重播</button></div><div class="screen" id="screen" aria-label="20 列 2 行显示模拟"><div class="row" id="row0"></div><div class="row" id="row1"></div></div><div class="meta"><span id="state">BOOT</span><span id="time">0 ms</span><span>20 × 2 / UART 9600</span></div><label>时间轴<input id="timeline" type="range" min="0" max="1800" step="40" value="0"></label><p class="note">模拟字格内容、帧率限制和串口排空时间，不模拟真实荧光亮度、像素字形与硬件启动时序。预览从驱动初始化开始，未包含默认 <code>2200ms</code> 的上电等待。本预览演示显示动画；实机人工模式在灭屏指令排空后关闭网络并进入轻睡眠，仅 GPIO3 按钮唤醒。</p></main><script>
const data = __ANIMATION_DATA__;
const $=id=>document.getElementById(id);let playing=true,start=performance.now(),position=0;
const states=['BOOT','AWAKE','CLOSING','ASLEEP','WAKING'];
for(let r=0;r<2;r++)for(let c=0;c<20;c++){const cell=document.createElement('span');cell.className='cell';$('row'+r).append(cell)}
function selected(){return data[$('mode').value][$('scene').selectedIndex]}
function populate(){const index=Math.max(0,$('scene').selectedIndex);$('scene').replaceChildren();for(const scene of data[$('mode').value]){const option=document.createElement('option');option.textContent=scene.name;$('scene').append(option)}$('scene').selectedIndex=index}
function draw(ms){const scene=selected();const frames=scene.frames;const frame=frames.findLast(f=>f.ms<=ms)||frames[0];for(let r=0;r<2;r++)Array.from($('row'+r).children).forEach((cell,c)=>cell.textContent=frame.rows[r][c]);$('screen').classList.toggle('off',frame.state===3);$('state').textContent=states[frame.state];$('time').textContent=frame.ms+' ms';$('timeline').max=frames.at(-1).ms;$('timeline').value=frame.ms}
function reset(){position=0;start=performance.now();draw(0)}
$('mode').onchange=()=>{populate();reset()};$('scene').onchange=reset;$('replay').onclick=reset;
$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'暂停':'播放';start=performance.now()-position};
$('timeline').oninput=()=>{playing=false;$('play').textContent='播放';position=Number($('timeline').value);draw(position)};
function animate(now){if(playing){const end=selected().frames.at(-1).ms;position=(now-start)%(end+700);draw(Math.min(position,end))}requestAnimationFrame(animate)}
populate();reset();requestAnimationFrame(animate);
</script></body></html>
